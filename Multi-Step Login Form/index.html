<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Nexus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       ANIMATED BACKGROUND BLOBS (matching screenshot)
  ════════════════════════════════════════════════════ -->
  <div class="bg-scene" aria-hidden="true">
    <div class="blob blob-tl"></div>
    <div class="blob blob-tr"></div>
    <div class="blob blob-bl"></div>
    <div class="blob blob-br"></div>
    <!-- Decorative squiggle shapes like in the screenshot -->
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="deco deco-3"></div>
    <div class="deco deco-4"></div>
  </div>

  <!-- ═══════════════════════════════════════════════
       MAIN PAGE
  ════════════════════════════════════════════════════ -->
  <div class="page-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="container px-3">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

          <!-- GLASS CARD -->
          <div class="glass-card">

            <!-- Logo -->
            <div class="logo-area text-center mb-3">
              <div class="logo-icon" aria-label="Your Logo">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                  <circle cx="14" cy="14" r="12" stroke="rgba(255,255,255,0.9)" stroke-width="2.5"/>
                  <path d="M9 14 L14 9 L19 14 L14 19 Z" fill="rgba(255,255,255,0.9)"/>
                </svg>
              </div>
              <span class="logo-text">NEXUS</span>
            </div>

            <!-- ── STEP INDICATOR ─────────────────────────── -->
            <div class="step-indicator mb-4" role="progressbar" aria-label="Registration progress" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3" id="step-bar">
              <div class="step-track">
                <!-- Step dots -->
                <div class="step-item">
                  <div class="step-dot active" id="dot-1" aria-label="Step 1: Personal Info">1</div>
                  <span class="step-lbl">Personal</span>
                </div>
                <div class="step-connector" id="con-1"></div>
                <div class="step-item">
                  <div class="step-dot" id="dot-2" aria-label="Step 2: Account Details">2</div>
                  <span class="step-lbl">Account</span>
                </div>
                <div class="step-connector" id="con-2"></div>
                <div class="step-item">
                  <div class="step-dot" id="dot-3" aria-label="Step 3: Confirm">3</div>
                  <span class="step-lbl">Confirm</span>
                </div>
              </div>
            </div>

            <!-- ════════════════════════════════════════════
                 STEP 1 — Personal Info
            ═════════════════════════════════════════════════ -->
            <div class="form-step" id="step-1">
              <h2 class="step-title">Personal Info</h2>

              <div class="field-group">
                <label class="field-label" for="name">Full Name</label>
                <div class="field-wrap">
                  <input type="text" id="name" name="name" class="field-input" placeholder="John Doe" autocomplete="name" />
                </div>
                <div class="field-error" id="name-err" role="alert"></div>
              </div>

              <div class="field-group">
                <label class="field-label" for="age">Age</label>
                <div class="field-wrap">
                  <input type="number" id="age" name="age" class="field-input" placeholder="18 – 120" min="18" max="120" autocomplete="off" />
                </div>
                <div class="field-error" id="age-err" role="alert"></div>
              </div>

              <div class="field-group">
                <label class="field-label" for="phone">Phone Number</label>
                <div class="field-wrap">
                  <input type="tel" id="phone" name="phone" class="field-input" placeholder="(123) 456-7890" autocomplete="tel" />
                </div>
                <div class="field-error" id="phone-err" role="alert"></div>
              </div>

              <div class="btn-row mt-4">
                <button type="button" class="btn-next w-100" id="next-1">
                  Next <span aria-hidden="true">→</span>
                </button>
              </div>
            </div>

            <!-- ════════════════════════════════════════════
                 STEP 2 — Account Details
            ═════════════════════════════════════════════════ -->
            <div class="form-step d-none" id="step-2">
              <h2 class="step-title">Account Details</h2>

              <div class="field-group">
                <label class="field-label" for="email">Email Address</label>
                <div class="field-wrap">
                  <input type="email" id="email" name="email" class="field-input" placeholder="username@gmail.com" autocomplete="email" />
                </div>
                <div class="field-error" id="email-err" role="alert"></div>
              </div>

              <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <div class="field-wrap field-wrap--icon-right">
                  <input type="password" id="password" name="password" class="field-input" placeholder="Password" autocomplete="new-password" />
                  <button type="button" class="eye-btn" id="eye-pwd" aria-label="Show password">
                    <!-- Eye open -->
                    <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <!-- Eye off (hidden by default) -->
                    <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
                <!-- Password strength bar -->
                <div class="strength-bar mt-2" id="strength-bar" aria-label="Password strength">
                  <div class="strength-seg" id="seg-1"></div>
                  <div class="strength-seg" id="seg-2"></div>
                  <div class="strength-seg" id="seg-3"></div>
                  <div class="strength-seg" id="seg-4"></div>
                </div>
                <div class="strength-label" id="strength-label"></div>
                <div class="field-error" id="pwd-err" role="alert"></div>
              </div>

              <div class="field-group">
                <label class="field-label" for="confirm-password">Confirm Password</label>
                <div class="field-wrap field-wrap--icon-right">
                  <input type="password" id="confirm-password" name="confirm-password" class="field-input" placeholder="Re-enter password" autocomplete="new-password" />
                  <button type="button" class="eye-btn" id="eye-cpwd" aria-label="Show confirm password">
                    <svg id="icon-eye-c" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="icon-eye-off-c" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
                <div class="field-error" id="cpwd-err" role="alert"></div>
              </div>

              <div class="btn-row d-flex gap-2 mt-4">
                <button type="button" class="btn-back flex-fill" id="back-2">
                  <span aria-hidden="true">←</span> Back
                </button>
                <button type="button" class="btn-next flex-fill" id="next-2">
                  Next <span aria-hidden="true">→</span>
                </button>
              </div>
            </div>

            <!-- ════════════════════════════════════════════
                 STEP 3 — Confirmation
            ═════════════════════════════════════════════════ -->
            <div class="form-step d-none" id="step-3">
              <h2 class="step-title">Confirm Details</h2>

              <!-- Success banner (shown after submit) -->
              <div class="success-banner d-none" id="success-banner" role="status" aria-live="polite">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                Registration successful! Welcome aboard.
              </div>

              <!-- Summary table -->
              <div class="confirm-table" id="confirm-table">
                <div class="confirm-row">
                  <span class="confirm-key">Name</span>
                  <span class="confirm-val" id="c-name">—</span>
                </div>
                <div class="confirm-row">
                  <span class="confirm-key">Age</span>
                  <span class="confirm-val" id="c-age">—</span>
                </div>
                <div class="confirm-row">
                  <span class="confirm-key">Phone</span>
                  <span class="confirm-val" id="c-phone">—</span>
                </div>
                <div class="confirm-row">
                  <span class="confirm-key">Email</span>
                  <span class="confirm-val" id="c-email">—</span>
                </div>
                <div class="confirm-row last">
                  <span class="confirm-key">Password</span>
                  <span class="confirm-val" id="c-password">—</span>
                </div>
              </div>

              <div class="btn-row d-flex gap-2 mt-4" id="step3-btns">
                <button type="button" class="btn-back flex-fill" id="back-3">
                  <span aria-hidden="true">←</span> Back
                </button>
                <button type="button" class="btn-submit flex-fill" id="submit-btn">
                  <span class="btn-label">Submit</span>
                  <span class="btn-spinner" aria-hidden="true"></span>
                </button>
              </div>
            </div>

            <!-- OR divider -->
            <div class="or-divider" aria-hidden="true"><span>or continue with</span></div>

            <!-- OAuth row -->
            <div class="oauth-row" role="group" aria-label="Sign in with a social account">
              <!-- Google -->
              <button type="button" class="oauth-btn" aria-label="Continue with Google" data-provider="Google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                  <path fill="#EA4335" d="M24 9.5c3.1 0 5.5 1.1 7.3 2.8l5.4-5.4C33.2 3.6 28.9 1.5 24 1.5 14.9 1.5 7.3 7 4 14.7l6.4 5C12 13.3 17.5 9.5 24 9.5z"/>
                  <path fill="#4285F4" d="M46.5 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-17z"/>
                  <path fill="#FBBC05" d="M10.4 28.8A14.8 14.8 0 0 1 9.5 24c0-1.7.3-3.3.8-4.8l-6.4-5A23.5 23.5 0 0 0 .5 24c0 3.8.9 7.3 2.5 10.4l7.4-5.6z"/>
                  <path fill="#34A853" d="M24 46.5c5 0 9.2-1.6 12.3-4.4l-7.4-5.7a14.8 14.8 0 0 1-4.9.8c-6.5 0-12-3.8-14.6-9.4l-7.4 5.7C7.3 41 15 46.5 24 46.5z"/>
                </svg>
              </button>

              <!-- GitHub -->
              <button type="button" class="oauth-btn" aria-label="Continue with GitHub" data-provider="GitHub">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true">
                  <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.31-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.005 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.87.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12.003 12.003 0 0 0 24 12C24 5.37 18.63 0 12 0z"/>
                </svg>
              </button>

              <!-- Facebook -->
              <button type="button" class="oauth-btn" aria-label="Continue with Facebook" data-provider="Facebook">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
                  <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
                </svg>
              </button>
            </div>

            <!-- Register link -->
            <p class="register-prompt">
              Already have an account? <a href="#" id="signin-link">Sign in</a>
            </p>

          </div><!-- /.glass-card -->
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       SAVED ENTRIES TABLE (below the card)
  ════════════════════════════════════════════════════ -->
  <div class="entries-section container px-3 pb-5" id="entries-section" style="display:none">
    <div class="entries-card">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="entries-title">Registered Users</h3>
        <button class="btn-clear-all" id="clear-all-btn" aria-label="Clear all entries">Clear all</button>
      </div>
      <div class="table-responsive">
        <table class="entries-table" id="entries-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Age</th>
              <th>Submitted</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entries-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
